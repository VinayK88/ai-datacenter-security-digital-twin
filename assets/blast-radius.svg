<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="720" viewBox="0 0 1300 720">
  <rect width="1300" height="720" fill="#0b1020"/>
  <g font-family="Arial">
    <text x="48" y="55" fill="#f8fafc" font-size="30" font-weight="700">Counterfactual Compromise — Blast Radius</text>
    <text x="48" y="88" fill="#94a3b8" font-size="16">What becomes reachable within 3 trust / topology hops?</text>

    <rect x="55" y="142" width="205" height="84" rx="12" fill="#7f1d1d" stroke="#ef4444" stroke-width="2"/>
    <text x="92" y="178" fill="#fff" font-size="18" font-weight="700">bmc-01-02</text>
    <text x="100" y="205" fill="#fecaca" font-size="13">compromised</text>

    <rect x="335" y="128" width="220" height="110" rx="12" fill="#172554" stroke="#3b82f6"/>
    <text x="365" y="166" fill="#fff" font-size="18" font-weight="700">gpu-node-01-02</text>
    <text x="370" y="193" fill="#bfdbfe" font-size="13">privileged host</text>
    <text x="370" y="216" fill="#bfdbfe" font-size="13">4 local GPUs</text>

    <rect x="635" y="112" width="235" height="128" rx="12" fill="#312e81" stroke="#818cf8"/>
    <text x="668" y="150" fill="#fff" font-size="18" font-weight="700">k8s-control-01</text>
    <text x="670" y="177" fill="#c7d2fe" font-size="13">cluster control plane</text>
    <text x="670" y="202" fill="#c7d2fe" font-size="13">reaches all GPU nodes</text>

    <rect x="950" y="95" width="270" height="145" rx="12" fill="#3f1d45" stroke="#d946ef"/>
    <text x="984" y="135" fill="#fff" font-size="18" font-weight="700">model-registry-01</text>
    <text x="985" y="163" fill="#f5d0fe" font-size="13">model artifacts + metadata</text>
    <text x="985" y="188" fill="#f5d0fe" font-size="13">adjacent object storage</text>
    <text x="985" y="213" fill="#f5d0fe" font-size="13">foundation-model-v3</text>

    <line x1="260" y1="184" x2="335" y2="184" stroke="#ef4444" stroke-width="3"/>
    <polygon points="335,184 322,176 322,192" fill="#ef4444"/>
    <line x1="555" y1="184" x2="635" y2="176" stroke="#f97316" stroke-width="3"/>
    <polygon points="635,176 622,169 623,185" fill="#f97316"/>
    <line x1="870" y1="176" x2="950" y2="168" stroke="#eab308" stroke-width="3"/>
    <polygon points="950,168 937,161 938,177" fill="#eab308"/>

    <rect x="68" y="320" width="1160" height="310" rx="16" fill="#111827" stroke="#334155"/>
    <text x="98" y="360" fill="#f8fafc" font-size="22" font-weight="700">3-hop impact summary</text>
    <text x="104" y="418" fill="#94a3b8" font-size="15">Reachable assets</text><text x="104" y="458" fill="#fff" font-size="36" font-weight="700">20</text>
    <text x="345" y="418" fill="#94a3b8" font-size="15">Critical assets</text><text x="345" y="458" fill="#fff" font-size="36" font-weight="700">12</text>
    <text x="570" y="418" fill="#94a3b8" font-size="15">GPU nodes</text><text x="570" y="458" fill="#fff" font-size="36" font-weight="700">6</text>
    <text x="760" y="418" fill="#94a3b8" font-size="15">GPUs</text><text x="760" y="458" fill="#fff" font-size="36" font-weight="700">4</text>
    <text x="930" y="418" fill="#94a3b8" font-size="15">Blast score</text><text x="930" y="458" fill="#ef4444" font-size="36" font-weight="700">0.4695</text>

    <text x="104" y="525" fill="#f8fafc" font-size="16" font-weight="700">Defensive actions</text>
    <text x="104" y="558" fill="#cbd5e1" font-size="14">• isolate BMC management network from workload fabric</text>
    <text x="104" y="586" fill="#cbd5e1" font-size="14">• rotate BMC credentials and validate firmware integrity</text>
    <text x="650" y="558" fill="#cbd5e1" font-size="14">• cordon affected GPU nodes and preserve runtime evidence</text>
    <text x="650" y="586" fill="#cbd5e1" font-size="14">• audit model-registry artifact reads if model paths become reachable</text>
  </g>
</svg>
