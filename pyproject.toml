[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-datacenter-security-digital-twin"
version = "0.1.0"
description = "Synthetic AI data center security digital twin for attack-path, blast-radius, and counterfactual analysis"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["digital_twin*"]
