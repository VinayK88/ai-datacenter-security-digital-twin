[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-datacenter-security-digital-twin"
version = "0.3.0"
description = "Synthetic AI data center security digital twin for directed attack-path, blast-radius, chokepoint, and resilience analysis"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["digital_twin*"]
