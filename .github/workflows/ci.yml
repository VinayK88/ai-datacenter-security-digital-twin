name: AI Data Center Digital Twin CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-api.txt -r requirements-dashboard.txt

      - name: Run unit and API tests
        run: python -m unittest discover -s tests -v

      - name: Run digital twin demo
        run: python -m digital_twin.demo

      - name: Run multivariate telemetry ML
        run: python -c "from digital_twin.ml_telemetry import model_report; from digital_twin.telemetry import generate_normal_telemetry; r=model_report(generate_normal_telemetry(), 5); assert r['model'] == 'PCAReconstructionAnomalyModel'"

      - name: Compile application modules
        run: python -m py_compile digital_twin/*.py dashboard/app.py api/app.py

      - name: Verify runtime imports
        run: python -c "import fastapi, httpx, pandas, pydantic, sklearn, streamlit, uvicorn; import api.app"

      - name: Smoke test FastAPI
        shell: bash
        run: |
          set -euo pipefail
          uvicorn api.app:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/health > /tmp/api-health.json; then
              curl -fsS 'http://127.0.0.1:8000/ml/telemetry?scenario=normal&limit=3' > /tmp/api-ml.json
              cat /tmp/api-health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/api.log
          exit 1

      - name: Smoke test Streamlit
        shell: bash
        run: |
          set -euo pipefail
          streamlit run dashboard/app.py --server.headless true --server.port 8501 > /tmp/streamlit.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for attempt in {1..25}; do
            if curl -fsS http://127.0.0.1:8501/_stcore/health > /tmp/streamlit-health.txt; then
              cat /tmp/streamlit-health.txt
              exit 0
            fi
            sleep 1
          done
          cat /tmp/streamlit.log
          exit 1

      - name: Build Docker image
        if: matrix.python-version == '3.12'
        run: docker build -t ai-datacenter-security-twin:ci .
